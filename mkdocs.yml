site_name: "junopy"
repo_url: "https://github.com/ysar/JunoPy"


nav:
  - index.md
  - About:
      - index.md
      - License: about/license.md
      - Release Notes: about/release-notes.md
      - Contributing: about/contributing.md
  - Getting Started: getting-started.md
  - Usage:
      - Magnetometer: modules/magnetometer.md
      - Waves: modules/waves.md
      - JEDI: modules/jedi.md
      - JADE: modules/jade.md
      - Auxiliary: modules/auxiliary.md
  - API Reference:
      - api/index.md
      - index: api/indexfiles.md
      - spice: api/spice.md
      - mag: api/mag.md
      - waves: api/waves.md
      - jedi: api/jedi.md
      - jade: api/jade.md
      - config: api/config.md
      - utils:
          - utils.download: api/utils/download.md
          - utils.compression: api/utils/compression.md
          - utils.convert: api/utils/convert.md
          - utils.field: api/utils/field.md
          - utils.misc: api/utils/misc.md
theme:
  name: "material"
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.instant.preview
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_options:
              ignore_init_summary: false
            # docstring_section_style: list
            filters: ["!^_"]
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

# markdown-extensions:
#   - smarty

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
