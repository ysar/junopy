[project]
name = "JunoPy"
version = "2.0.0"
authors = [
  { name="Yash Sarkango"},
]

description = "A package to use plasma and fields data from the Juno spacecraft."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPL-3.0-only",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "spiceypy",
    "h5py",
    "pytest",
    "mkdocs",
    "pymdown-extensions",
    "isal"
]

