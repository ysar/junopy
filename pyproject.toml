[project]
name = "junopy"
version = "2.1.2"
authors = [{ name = "Yash Sarkango" }]

description = "A package to use plasma and fields data from the Juno spacecraft."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "isal>=1.8.0",
    "iupitermag>=0.2.4",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "scipy>=1.16.0",
    "spiceypy>=6.0.1",
    "tables>=3.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "griffe>=2.4.1",
    "ipykernel>=6.29.5",
    "memory-profiler>=0.61.0",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.27.0",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=8.4.1",
]
